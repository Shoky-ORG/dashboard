      operationId: addInstructor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInstructorBody'
            example:
              user_id: 7
              role_in_course: "ta"
      responses:
        '201':
          description: Instructor added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          course_id:
                            type: integer
                          user_id:
                            type: integer
                          role_in_course:
                            $ref: '#/components/schemas/InstructorRole'
                          assigned_at:
                            type: string
                            format: date-time
                          assigned_by:
                            type: integer
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':

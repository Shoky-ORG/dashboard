                  properties:
                    file:
                      type: string
                      format: binary
                      description: Optional file upload (pdf, image, document)
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialBody'
      responses:
        '201':
          description: Material created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:

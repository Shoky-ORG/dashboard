  # COURSES
  # ═══════════════════════════════════════════════════════════════════════════

  /courses:
    post:
      tags: [Courses]
      summary: Create a course
      description: >
        Creator is automatically added as DOCTOR instructor.
        Increments dashboard course_count for the department.
        Rate limited: 5 req/60s.
      operationId: createCourse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseBody'
            example:
              code: "CS301"
              title_ar: "هندسة البرمجيات"
              title_en: "Software Engineering"
              description: "Core software engineering concepts"
              credit_hours: 3
              academic_year: 3
              semester: 1
              department: "computer_science"
              is_active: true
      responses:
        '201':
          description: Course created and returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          description: Course code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 409
                message: "Course code already exists"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses"
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

    get:
      tags: [Courses]
      summary: List all courses (paginated)
      description: >
        Returns paginated courses with instructors.
        Response is cached in Redis by CourseCacheService.
        Available to ALL authenticated users (no @Roles restriction).
        Rate limited: 5 req/60s.
        Note: Uses ParseIntPipe on query params — page/limit must be valid integers.
      operationId: findAllCourses
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Paginated courses list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMetaAlt'
              example:
                success: true
                statusCode: 200
                message: "Operation successful"
                data:
                  - id: 1
                    code: "CS301"
                    title_ar: "هندسة البرمجيات"
                    title_en: "Software Engineering"
                    credit_hours: 3
                    academic_year: 3
                    semester: 1
                    department: "computer_science"
                    is_active: true
                    created_at: "2024-01-15T10:00:00.000Z"
                    instructors:
                      - user_id: 5
                        name: "Dr. Samira Hassan"
                        role_in_course: "doctor"
                meta:
                  totalItems: 25
                  itemCount: 10
                  itemsPerPage: 10
                  totalPages: 3
                  currentPage: 1
        '400':
          description: Invalid pagination parameters (non-integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /courses/{id}:
    get:
      tags: [Courses]
      summary: Get a single course by ID
      description: >
        Returns full course details including creator and instructors.
        Result is cached in Redis.
        Available to ALL authenticated users.
      operationId: findCourseById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Course not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses/999"
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

    patch:
      tags: [Courses]
      summary: Update a course
      description: >
        Only course creator or SUPER_ADMIN can update.
        Invalidates course Redis cache.
        Course code uniqueness checked if changed.
      operationId: updateCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseBody'
      responses:
        '200':
          description: Course updated (returns full Course entity)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Not course creator or super admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 403
                message: "Only course creator or super admin can update this course"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses/1"
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

    delete:
      tags: [Courses]
      summary: Delete a course
      description: >
        Only course creator or SUPER_ADMIN can delete.
        Cannot delete if there are active enrollments.
        Decrements dashboard course_count.
      operationId: deleteCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                statusCode: 200
                message: "Course deleted successfully"
                data: null
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Not creator/super_admin, or course has enrollments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notCreator:
                  value:
                    success: false
                    statusCode: 403
                    message: "Only course creator or super admin can delete this course"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/courses/1"
                hasEnrollments:
                  value:
                    success: false
                    statusCode: 403
                    message: "Cannot delete course with active enrollments"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/courses/1"
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'


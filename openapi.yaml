                  value:
                    success: false
                    statusCode: 403
                    message: "You are not an assigned Doctor in this course"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/courses/1/instructors"
                doctorCanOnlyAddTA:
                  value:
                    success: false
                    statusCode: 403
                    message: "Doctors can only add TAs"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"

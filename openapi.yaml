        '500':
          $ref: '#/components/responses/500InternalError'

  /courses/{courseId}/assignments/{id}:
    get:
      tags: [Assignments]
      summary: Get a single assignment
      operationId: findAssignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Assignment detail (includes course and creator relations)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssignmentResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Assignment not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Assignment not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses/1/assignments/99"
        '500':
          $ref: '#/components/responses/500InternalError'

    patch:
      tags: [Assignments]
      summary: Update assignment (with optional file replace)
      description: DOCTOR and TA only.
      operationId: updateAssignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateAssignmentBody'
                - type: object
                  properties:
                    file:
                      type: string
                      format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentBody'
      responses:
        '200':
          description: Assignment updated (returns full entity)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssignmentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

    delete:
      tags: [Assignments]
      summary: Soft-delete an assignment
      description: >
        Sets is_active=false (soft delete). Does NOT remove from database.
        DOCTOR and TA only.
      operationId: deleteAssignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
        - $ref: '#/components/parameters/IdParam'
      responses:

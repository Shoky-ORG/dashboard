        '500':
          $ref: '#/components/responses/500InternalError'

  # ═══════════════════════════════════════════════════════════════════════════
  # ENROLLMENT
  # ═══════════════════════════════════════════════════════════════════════════

  /course/{id}/enroll:
    post:
      tags: [Enrollment]
      summary: Enroll in a course (Student only)
      description: >
        NOTE: The enrollment controller uses prefix `course/:id` (singular, not courses).
        If re-enrolled after dropping, status is changed back to active.
        Throws 409 if already actively enrolled.
        Rate limited: 5 req/60s.
      operationId: enrollCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Enrolled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enrollmentId:
                            type: integer
                          studentId:
                            type: integer
                          courseId:
                            type: integer
              example:
                success: true
                statusCode: 201
                message: "Enrolled successfully"
                data:
                  enrollmentId: 42
                  studentId: 1
                  courseId: 5
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Course not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/course/999/enroll"
        '409':
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 409
                message: "Already enrolled in this course"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/course/5/enroll"
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /course/{id}/unenroll:
    delete:
      tags: [Enrollment]
      summary: Unenroll from a course (Student only)
      description: "Sets enrollment status to DROPPED (soft delete). Rate limited: 5 req/60s."
      operationId: unenrollCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Unenrolled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          studentId:
                            type: integer
                          courseId:
                            type: integer
                          unenrolledAt:
                            type: string
                            format: date-time
              example:
                success: true
                statusCode: 200
                message: "Unenrolled successfully"
                data:
                  studentId: 1
                  courseId: 5
                  unenrolledAt: "2024-01-15T12:00:00.000Z"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Not enrolled in this course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Not enrolled in this course"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/course/5/unenroll"
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /course/{id}/students:
    get:
      tags: [Enrollment]
      summary: Get students enrolled in a course (paginated)
      description: >
        Returns active enrollments only.
        SUPER_ADMIN, ADMIN, DOCTOR only.
        Rate limited: 5 req/60s.
        Note: Uses ParseIntPipe — page/limit must be valid integers.
      operationId: getCourseStudents
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Students enrolled in course
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: array
                            items:
                              $ref: '#/components/schemas/EnrollmentStudentItem'
                          currentPage:
                            type: integer
                          totalPages:
                            type: integer
                          totalItems:
                            type: integer
              example:
                success: true
                statusCode: 200
                message: "Students fetched successfully"
                data:
                  results:
                    - id: 42
                      enrolled_at: "2024-01-10T08:00:00.000Z"
                      student:
                        id: 1
                        fullName: "Ahmed Ibrahim"
                        username: "ahmed"
                        email: "220010001@hti.edu.eg"
                  currentPage: 1
                  totalPages: 3
                  totalItems: 25
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  /notifications:
    post:
      tags: [Notifications]
      summary: Send a notification
      description: >
        ADMIN, SUPER_ADMIN, DOCTOR only.
        Dispatched in batches of 1000 recipients in a database transaction.
        SPECIFIC_USERS: user_ids are actually STUDENT NUMBER integers (not user IDs) —
        this is a known naming inconsistency.
        STUDENT_RANGE: from_student_number must be <= to_student_number.
        Returns 400 if no recipients found.
        No rate limit on NotificationsController.
      operationId: sendNotification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationBody'
            examples:
              toAll:
                summary: Send to all users
                value:
                  title: "System Maintenance"
                  message: "The system will be down for maintenance on Sunday"
                  type: "system"
                  target_type: "all"
              toCourse:
                summary: Send to course students
                value:
                  title: "Assignment Reminder"
                  message: "Homework 1 is due in 2 days"
                  type: "assignment"
                  target_type: "course_specific"
                  course_id: 42
              toUsers:
                summary: Send to specific students by student number
                value:
                  title: "Grade Update"
                  message: "Your grade for Midterm has been posted"
                  type: "grade"
                  target_type: "specific_users"
                  user_ids: [220010001, 220010002]
              toRange:
                summary: Send to student number range
                value:
                  title: "Department Announcement"
                  message: "Welcome back to the new semester"
                  type: "announcement"
                  target_type: "student_range"
                  from_student_number: 220010001
                  to_student_number: 220010100
      responses:
        '201':
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                statusCode: 201
                message: "Notification sent successfully"
                data: null
        '400':
          description: No recipients found or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noRecipients:
                  value:
                    success: false
                    statusCode: 400
                    message: "No recipients found"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/notifications"
                rangeError:
                  value:
                    success: false
                    statusCode: 400
                    message: "from_student_number must be less than or equal to to_student_number"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/notifications"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      description: >
        Marks a specific notification as read for the current user.
        Returns 200 even if already marked (idempotent with message).
        Available to ALL authenticated roles (no @Roles).
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Marked as read (or already read)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                marked:
                  value:
                    success: true
                    statusCode: 200
                    message: "Marked as read"
                    data: null
                alreadyRead:
                  value:
                    success: true
                    statusCode: 200
                    message: "Already marked as read"
                    data: null
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Notification not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Notification not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/notifications/99/read"
        '500':
          $ref: '#/components/responses/500InternalError'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      description: >
        Updates all unread notifications for the current user to is_read=true.
        Available to ALL authenticated roles.
        Note: Route ordering — this must be matched BEFORE /notifications/:id/read.
        In NestJS, routes are matched in declaration order; /read-all is declared
        BEFORE /:id/read so it takes priority correctly.
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                statusCode: 200
                message: "All marked as read"
                data: null
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ═══════════════════════════════════════════════════════════════════════════
  # STUDENT PROFILES
  # ═══════════════════════════════════════════════════════════════════════════

  /student-profiles/profile:
    post:
      tags: [Student Profiles]
      summary: Create student profile (with optional avatar upload)
      description: >
        STUDENT creates their own profile (uses current user ID).
        Student profile includes student_number (unique), department, track, GPA.
        Avatar is uploaded to Cloudinary under HTI/avatars/ and stored in user.avatar_url.
        Increments dashboard student_count.
        Also updates user.department from profile.
        Rate limited: 5 req/60s.
        Note: Controller has @UseGuards(AuthGuard) again (redundant, already on class).
      operationId: createStudentProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateStudentProfileBody'
                - type: object
                  properties:
                    avatar:
                      type: string
                      format: binary
                      description: Optional avatar image
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentProfileBody'
      responses:
        '201':
          description: Student profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentProfileResponse'
        '400':
          description: Profile already exists or student number taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyExists:
                  value:
                    success: false
                    statusCode: 400
                    message: "Student profile already exist"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/student-profiles/profile"
                numberTaken:
                  value:
                    success: false
                    statusCode: 400
                    message: "Student number already in use"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/student-profiles/profile"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /student-profiles/findAllStudentProfiles:
    get:
      tags: [Student Profiles]
      summary: List all student profiles (Admin / Doctor only)
      description: >
        Paginated list. Rate limited: 5 req/60s.
        Note: Route uses camelCase (findAllStudentProfiles) — naming inconsistency.
      operationId: findAllStudentProfiles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated student profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudentProfileResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMetaAlt'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /student-profiles/me:
    get:
      tags: [Student Profiles]
      summary: Get my student profile (Student only)
      operationId: findMyStudentProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Student profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Student profile not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/student-profiles/me"
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

    patch:
      tags: [Student Profiles]
      summary: Update my student profile (Student only, with optional avatar)
      description: >
        student_number and user_id cannot be updated (enforced in both controller and service).
        Avatar is replaced on Cloudinary (old one destroyed).
        Note: controller uses @Body() body: any instead of UpdateStudentProfileDto.
        UpdateStudentProfileDto is PartialType(OmitType(Create, ['student_number'])).
      operationId: updateMyStudentProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateStudentProfileBody'
                - type: object
                  properties:
                    avatar:
                      type: string
                      format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileBody'
      responses:
        '200':
          description: Profile updated (returns updated StudentProfile entity)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentProfileResponse'
        '400':
          description: Cannot update student_number or user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 400
                message: "student_number and user_id cannot be updated"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/student-profiles/me"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

    delete:
      tags: [Student Profiles]
      summary: Delete my student profile (Student only)
      description: Hard deletes the StudentProfile record. User account remains.
      operationId: deleteMyStudentProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                statusCode: 200
                message: "Student profile deleted successfully"
                data: null
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ═══════════════════════════════════════════════════════════════════════════
  # DASHBOARD
  # ═══════════════════════════════════════════════════════════════════════════

  /dashboard/super-admin:
    get:
      tags: [Dashboard]
      summary: Super Admin dashboard
      description: >
        Returns department stats for the super admin's department:
        doctor_count, ta_count, admin_count, course_count, student_count,
        app_student_count, assignment_count, material_count, announcement_count.
        Rate limited: 5 req/60s.
      operationId: getSuperAdminDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Super admin stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role:
                            type: string
                            example: "super_admin"
                          stats:
                            type: array
                            items:
                              type: object
                              properties:
                                department:
                                  $ref: '#/components/schemas/Department'
                                doctor_count:
                                  type: integer
                                ta_count:
                                  type: integer
                                admin_count:
                                  type: integer
                                course_count:
                                  type: integer
                                student_count:
                                  type: integer
                                app_student_count:
                                  type: integer
                                assignment_count:
                                  type: integer
                                material_count:
                                  type: integer
                                announcement_count:
                                  type: integer
                                last_updated:
                                  type: string
                                  format: date-time
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /dashboard/admin:
    get:
      tags: [Dashboard]
      summary: Admin dashboard
      description: >
        Returns department stats: doctor_count, ta_count, course_count, student_count.
        Subset of super admin stats.
      operationId: getAdminDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role:
                            type: string
                            example: "admin"
                          stats:
                            type: array
                            items:
                              type: object
                              properties:
                                department:
                                  $ref: '#/components/schemas/Department'
                                doctor_count:
                                  type: integer
                                ta_count:
                                  type: integer
                                course_count:
                                  type: integer
                                student_count:
                                  type: integer
                                last_updated:
                                  type: string
                                  format: date-time
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /dashboard/doctor:
    get:
      tags: [Dashboard]
      summary: Doctor dashboard (paginated courses)
      description: >
        Returns the doctor's assigned active courses with per-course stats:
        student_count, ta_count, assignment_count, material_count.
        Paginated via page/limit query params.
      operationId: getDoctorDashboard
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          required: false
      responses:
        '200':
          description: Doctor dashboard with courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role:
                            type: string
                            example: "doctor"
                          courses:
                            type: array
                            items:
                              type: object
                              properties:
                                course_id:
                                  type: integer
                                title_ar:
                                  type: string
                                title_en:
                                  type: string
                                student_count:
                                  type: integer
                                ta_count:
                                  type: integer
                                assignment_count:
                                  type: integer
                                material_count:
                                  type: integer
                          meta:
                            type: object
                            properties:
                              total:
                                type: integer
                              page:
                                type: integer
                              limit:
                                type: integer
                              total_pages:
                                type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /dashboard/student:
    get:
      tags: [Dashboard]
      summary: Student dashboard
      description: >
        Returns:
        enrolled_courses (active), unread_announcements, pending_assignments
        (due date in future or null), upcoming_exams (exam_date in future).
      operationId: getStudentDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student dashboard stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role:
                            type: string
                            example: "student"
                          enrolled_courses:
                            type: integer
                          unread_announcements:
                            type: integer
                          pending_assignments:
                            type: integer
                          upcoming_exams:
                            type: integer
              example:
                success: true
                statusCode: 200
                message: "Operation successful"
                data:
                  role: "student"
                  enrolled_courses: 4
                  unread_announcements: 2
                  pending_assignments: 3
                  upcoming_exams: 1
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

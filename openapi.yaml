  /users/change-password:
    patch:
      tags: [Users]
      summary: Change own password
      description: >
        Verifies currentPassword against stored hash.
        Enforces newPassword !== currentPassword.
        MatchPasswordPipe validates newPassword === confirmNewPassword.
        Available to ALL authenticated roles.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordBody'
            example:
              currentPassword: "OldStr0ng!Pass"
              newPassword: "NewStr0ng!Pass123"
              confirmNewPassword: "NewStr0ng!Pass123"
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                statusCode: 200
                message: "Password changed successfully"
                data: null
        '400':
          description: Current password wrong or new password same as old
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongCurrent:
                  value:
                    success: false
                    statusCode: 400
                    message: "Current password is incorrect"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/users/change-password"
                samePassword:
                  value:
                    success: false
                    statusCode: 400
                    message: "New password must be different from current password"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/users/change-password"
                mismatch:
                  value:
                    success: false
                    statusCode: 400
                    message: "New password does not match confirm new password"
                    data: null
                    timestamp: "2024-01-15T12:00:00.000Z"
                    path: "/api/v1/users/change-password"
        '401':
          $ref: '#/components/responses/401Unauthorized'

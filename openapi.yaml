  # ASSIGNMENTS
  # ═══════════════════════════════════════════════════════════════════════════

  /courses/{courseId}/assignments:
    post:
      tags: [Assignments]
      summary: Create assignment in a course (with optional file upload)
      description: >
        DOCTOR and TA only.
        Body uses `dto: any` in controller — class-validator decorators from
        CreateAssignmentDto are NOT applied (this is a known bug).
        File is uploaded to Cloudinary under HTI/assignments/.
        Increments dashboard assignment_count.
        Soft-delete pattern: assignments have is_active flag.
        Note: No rate limit decorator on AssignmentController.
      operationId: createAssignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateAssignmentBody'
                - type: object
                  properties:
                    file:
                      type: string
                      format: binary
                      description: Optional assignment file (pdf, image, document)
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentBody'
      responses:
        '201':
          description: Assignment created (returns saved entity)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssignmentResponse'
        '400':
          description: External link missing or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 400
                message: "external_form_link is required when delivery method is EXTERNAL_LINK"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses/1/assignments"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                statusCode: 404
                message: "Course not found"
                data: null
                timestamp: "2024-01-15T12:00:00.000Z"
                path: "/api/v1/courses/999/assignments"
        '500':
          $ref: '#/components/responses/500InternalError'

    get:
      tags: [Assignments]
      summary: List assignments for a course
      description: Returns active assignments ordered by created_at DESC. DOCTOR, TA, STUDENT.
      operationId: findAssignmentsByCourse
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      responses:
        '200':
          description: Assignments list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssignmentResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /courses/{courseId}/assignments/my:
    get:
      tags: [Assignments]
      summary: Get student's assignments across all enrolled courses
      description: >
        Returns active assignments for courses the student is actively enrolled in.
        Ordered by due_date ASC.
        STUDENT only.
      operationId: findMyAssignments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdParam'
      responses:
